<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 요소</title>
  </head>
  <body>
    <h2>Form 요소 살펴보기</h2>
    <!-- 로그인 박스 -->
    <form>
      <h5>로그인 해주세요</h5>
      <div>
        <label for="userid">ID:</label>
        <input
          id="userid"
          type="text"
          name="userId"
          value=""
          placeholder="ID를 입력하세요"
          required
        />
      </div>
      <div>
        password:
        <input
          type="password"
          id="pw"
          name="userpassword"
          placeholder="패스워드를 입력하세요"
          required
        />
      </div>
      <br />
      <br />
      <input type="submit" value="로그인" />
    </form>
    <form>
      <!-- 체크박스  -->
      <h5>개발환경 설치</h5>
      <input type="checkbox" name="setup" value="vscode" id="vacode" />
      <label for="vacode"> VS Code설치 </label>
      <br />
      <input type="checkbox" name="setup" value="node" id="node" />
      <label for="node">Node 설치</label>
      <br />
      <input type="checkbox" name="setup" value="git" id="git" />
      <label for="git">Git 설치</label>
      <br />
      <input type="checkbox" name="setup" value="claudecode" id="claudecode" />
      <label for="claudecode">Claude 코드 설치</label>

      <!-- 라디오 버튼 -->
      <h5>강의 난이도</h5>
      <input type="radio" name="level" value="beginner" id="beginner" />
      <label for="beginner"> 입문 </label>
      <br />
      <input type="radio" name="level" value="middle" id="middle" />
      <label for="middle">중급</label>
      <br />
      <input type="radio" name="level" value="advanced" id="advanced" />
      <label for="advanced">고급</label>
    </form>
  </body>
</html>
