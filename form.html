<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form 요소</title>
  </head>
  <body>
    <h2>Form 요소 살펴보기</h2>
    <!-- 로그인 박스 -->
    <form>
      <h5>로그인 해주세요</h5>
      <div>
        ID:
        <input
          type="text"
          name="userId"
          value=""
          placeholder="ID를 입력하세요"
          required
        />
      </div>
      <div>
        password:
        <input
          type="password"
          id="pw"
          name="userpassword"
          placeholder="패스워드를 입력하세요"
          required
        />
      </div>
      <br />
      <br />
      <input type="submit" value="로그인" />
    </form>
  </body>
</html>
